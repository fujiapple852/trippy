name: release
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
jobs:
  create-release:
    name: create-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      trip_version: ${{ env.TRIP_VERSION }}
    steps:
      - name: Get the release version from the tag
        shell: bash
        if: env.TRIP_VERSION == ''
        run: |
          echo "TRIP_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          echo "version is: ${{ env.TRIP_VERSION }}"
      - name: Create GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.TRIP_VERSION }}
          name: Trippy ${{ env.TRIP_VERSION }}
          body: See [CHANGELOG.md](https://github.com/fujiapple852/trippy/blob/master/CHANGELOG.md) for details.
          prerelease: false

  build-release:
    name: build-release
    needs: ['create-release']
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      CARGO: cargo
      TARGET_FLAGS: ""
      TARGET_DIR: ./target
      CROSS_NO_WARNINGS: 0
      RUST_BACKTRACE: 1
    strategy:
      matrix:
        build: [
          x86_64-linux-gnu, x86_64-linux-musl, aarch64-linux-gnu, aarch64-linux-musl,
          armv7-linux-gnueabihf, armv7-linux-musleabihf, armv7-linux-musleabi,
          x86_64-apple-darwin, aarch64-apple-darwin,
          x86_64-pc-windows-msvc, x86_64-pc-windows-gnu, aarch64-pc-windows-msvc,
          x86_64-netbsd, x86_64-freebsd
        ]
        include:
          # Linux (x86_64 & aarch64)
          - build: x86_64-linux-gnu
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - build: x86_64-linux-musl
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - build: aarch64-linux-gnu
            os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
          - build: aarch64-linux-musl
            os: ubuntu-24.04
            target: aarch64-unknown-linux-musl

          # Linux (armv7)
          - build: armv7-linux-gnueabihf
            os: ubuntu-24.04
            target: armv7-unknown-linux-gnueabihf
          - build: armv7-linux-musleabihf
            os: ubuntu-24.04
            target: armv7-unknown-linux-musleabihf
          - build: armv7-linux-musleabi
            os: ubuntu-24.04
            target: armv7-unknown-linux-musleabi

          # macOS (x86_64 & aarch64)
          - build: x86_64-apple-darwin
            os: macos-15-intel
            target: x86_64-apple-darwin
          - build: aarch64-apple-darwin
            os: macos-latest
            target: aarch64-apple-darwin

          # Windows (x86_64 & aarch64)
          - build: x86_64-pc-windows-msvc
            os: windows-2025
            target: x86_64-pc-windows-msvc
          - build: x86_64-pc-windows-gnu
            os: ubuntu-24.04
            target: x86_64-pc-windows-gnu
          - build: aarch64-pc-windows-msvc
            os: windows-2025
            target: aarch64-pc-windows-msvc

          # BSD (x86_64)
          - build: x86_64-netbsd
            os: ubuntu-24.04
            target: x86_64-unknown-netbsd
          - build: x86_64-freebsd
            os: ubuntu-24.04
            target: x86_64-unknown-freebsd

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Use Cross
        shell: bash
        run: |
          cargo install cross --git https://github.com/cross-rs/cross
          echo "CARGO=cross" >> $GITHUB_ENV
          echo "TARGET_FLAGS=--target ${{ matrix.target }}" >> $GITHUB_ENV
          echo "TARGET_DIR=./target/${{ matrix.target }}" >> $GITHUB_ENV

      - name: Show command used for Cargo
        run: |
          echo "cargo command is: ${{ env.CARGO }}"
          echo "target flag is: ${{ env.TARGET_FLAGS }}"
          echo "target dir is: ${{ env.TARGET_DIR }}"

      - name: Build release binary
        run: ${{ env.CARGO }} build --verbose --release ${{ env.TARGET_FLAGS }}

      - name: Build archive
        shell: bash
        run: |
          staging="trippy-${{ needs.create-release.outputs.trip_version }}-${{ matrix.target }}"
          mkdir -p "$staging"
          if [ "${{ matrix.os }}" = "windows-2025" ] || [ "${{ matrix.build }}" = "x86_64-pc-windows-gnu" ]; then
            cp "target/${{ matrix.target }}/release/trip.exe" "$staging/"
            7z a -tzip "$staging.zip" "$staging"
            echo "ASSET=$staging.zip" >> $GITHUB_ENV
          else
            cp "target/${{ matrix.target }}/release/trip" "$staging/"
            tar czf "$staging.tar.gz" "$staging"
            echo "ASSET=$staging.tar.gz" >> $GITHUB_ENV
          fi

      - name: Build RPM package
        shell: bash
        if: startsWith(matrix.build, 'x86_64-linux-gnu')
        run: |
          cargo install cargo-generate-rpm
          cargo generate-rpm -p crates/trippy --target ${{ matrix.target }} -o target/${{ matrix.target }}/generate-rpm/trippy-${{ needs.create-release.outputs.trip_version }}-x86_64.rpm

      - name: Upload RPM package
        if: startsWith(matrix.build, 'x86_64-linux-gnu')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.create-release.outputs.trip_version }}
          files: target/${{ matrix.target }}/generate-rpm/trippy-${{ needs.create-release.outputs.trip_version }}-x86_64.rpm
          fail_on_unmatched_files: true

      - name: Create Debian package
        shell: bash
        if: startsWith(matrix.build, 'x86_64-linux-gnu') || startsWith(matrix.build, 'x86_64-linux-musl')
        run: |
          cargo install cargo-deb
          cargo deb -p trippy --target ${{ matrix.target }} --deb-version ${{ needs.create-release.outputs.trip_version }}
          case ${{ matrix.target }} in
            aarch64-*-linux-*) DPKG_ARCH=arm64 ;;
            arm-*-linux-*hf) DPKG_ARCH=armhf ;;
            i686-*-linux-*) DPKG_ARCH=i686 ;;
            x86_64-*-linux-*) DPKG_ARCH=amd64 ;;
            *) DPKG_ARCH=notset ;;
          esac;
          echo "DPKG_ARCH=${DPKG_ARCH}" >> $GITHUB_ENV
          # Uploads use the local basename, so preserve the public release filename.
          deb_dir="target/${{ matrix.target }}/debian"
          mv "$deb_dir/trippy_${{ needs.create-release.outputs.trip_version }}_${DPKG_ARCH}.deb" \
            "$deb_dir/trippy_${{ matrix.target }}_${{ needs.create-release.outputs.trip_version }}_${DPKG_ARCH}.deb"

      - name: Upload Deb Release Asset
        if: startsWith(matrix.build, 'x86_64-linux-gnu') || startsWith(matrix.build, 'x86_64-linux-musl')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.create-release.outputs.trip_version }}
          files: target/${{ matrix.target }}/debian/trippy_${{ matrix.target }}_${{ needs.create-release.outputs.trip_version }}_${{ env.DPKG_ARCH }}.deb
          fail_on_unmatched_files: true

      - name: Upload release archive
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.create-release.outputs.trip_version }}
          files: ${{ env.ASSET }}
          fail_on_unmatched_files: true
